name: Record LME cash prices

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      fetch_only:
        description: 'Only fetch and print LME prices; do not update Google Sheets'
        required: false
        default: false
        type: boolean

jobs:
  record-prices:
    runs-on: [self-hosted, lme]
    timeout-minutes: 20

    env:
      DETAILS: ${{ secrets.DETAILS }}
      LME_USERNAME: ${{ secrets.LME_USERNAME }}
      LME_PASSWORD: ${{ secrets.LME_PASSWORD }}
      LME_LOGIN_URL: ${{ secrets.LME_LOGIN_URL }}
      GOOGLE_SHEETS: ${{ secrets.GOOGLE_SHEETS }}
      GOOGLE_SHEETS_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
      GOOGLE_SHEETS_WEBAPP_TOKEN: ${{ secrets.GOOGLE_SHEETS_WEBAPP_TOKEN }}
      GOOGLE_SHEETS_TOKEN: ${{ secrets.GOOGLE_SHEETS_TOKEN }}
      WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
      WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
      DEBUG_ARTIFACT_DIR: debug-artifacts
      LME_STORAGE_STATE: ~/.lme/lme-storage-state.json
      LME_FETCH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_only }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Record LME cash prices
        run: npm run fetch:lme

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lme-debug-artifacts
          path: debug-artifacts
          if-no-files-found: ignore
